name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The disko image builder installs the system inside a QEMU VM and needs KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build image
        run: nix build -L .#image

      - name: Compress
        run: |
          nix shell nixpkgs#qemu-utils -c \
            qemu-img convert -c -O qcow2 result/main.qcow2 nixos-cloudinit-x86_64-linux.qcow2
          sha256sum nixos-cloudinit-x86_64-linux.qcow2 > nixos-cloudinit-x86_64-linux.qcow2.sha256
          ls -lh nixos-cloudinit-x86_64-linux.qcow2

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: nixos-cloudinit-x86_64-linux.qcow2
          path: nixos-cloudinit-x86_64-linux.qcow2*
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            nixos-cloudinit-x86_64-linux.qcow2 nixos-cloudinit-x86_64-linux.qcow2.sha256
